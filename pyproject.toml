[project]
name = "ha-citipower-myenergy"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_level = "WARNING"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["custom_components/citipower_myenergy"]

[tool.coverage.report]
show_missing = true
# No omit list and no exclusions: every module counts, test files are outside the source.
