name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # hacs/action looks the repo up via the GitHub API with github_token; on Gitea
    # that is a Gitea token, so it fails with "Bad credentials". Only run on GitHub.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # No ignores: the HACS default store needs this to pass as it is. The brands check is
          # met by the images in custom_components/citipower_myenergy/brand/.

  tests:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check custom_components tests
      # One run does both jobs: the tests, and the numbers for the Silver quality-scale rule
      # test-coverage (every module over 95%, branches included).
      - name: pytest with coverage
        run: >
          pytest -q --cov=custom_components/citipower_myenergy --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-report=html
      # Prints the per-module table, adds it to the job summary where one exists (GitHub; the
      # script skips it when GITHUB_STEP_SUMMARY is unset) and fails if any module is under the
      # bar. The bar is MIN_COVERAGE_PERCENT in the script.
      - name: Coverage per module
        run: python scripts/coverage_summary.py coverage.xml
      # Gitea Actions does not implement the artifact service that upload-artifact v4 needs.
      - name: Upload coverage report
        if: ${{ !cancelled() && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
